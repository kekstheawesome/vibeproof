openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyze
    description: Red flag detection analysis
  - name: Auth
    description: Browser authentication endpoints.
  - name: history
    description: Analysis history for authenticated users
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeText
      tags: [analyze]
      summary: Analyze text or image for red flags
      description: Analyzes a text message or screenshot for manipulation, coercion, dishonesty, aggression, boundary violations, or controlling behavior
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Analysis limit reached — sign up required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitReachedResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analyses:
    get:
      operationId: getAnalysisHistory
      tags: [history]
      summary: Get the authenticated user's analysis history
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: List of past analyses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisHistoryResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeRequest:
      type: object
      properties:
        imageBase64:
          type: ["string", "null"]
          description: Base64-encoded image of a screenshot (optional)
        text:
          type: ["string", "null"]
          description: Plain text of a message or conversation (optional)
        context:
          type: ["string", "null"]
          description: Additional context provided by the user about the situation
      description: At least one of imageBase64 or text must be provided
    RedFlag:
      type: object
      properties:
        category:
          type: string
          description: Category of red flag (e.g. manipulation, coercion, aggression)
        quote:
          type: string
          description: Direct quote or evidence from the text
        explanation:
          type: string
          description: Evidence-based explanation of why this is a red flag
      required:
        - category
        - quote
        - explanation
    AnalysisResult:
      type: object
      properties:
        severityScore:
          type: number
          description: Severity score from 0 to 5 (0 = no red flags, 5 = extremely concerning)
        severityLabel:
          type: string
          description: Human-readable label for the severity level
        redFlags:
          type: array
          items:
            $ref: "#/components/schemas/RedFlag"
          description: List of detected red flags with evidence
        overallExplanation:
          type: string
          description: A calm, clear explanation of the overall situation
        suggestedResponses:
          type: array
          items:
            type: string
          description: Suggested ways to respond to the situation
        needsMoreContext:
          type: boolean
          description: Whether more context is needed for accurate analysis
        contextQuestions:
          type: array
          items:
            type: string
          description: Questions to ask the user if more context is needed
      required:
        - severityScore
        - severityLabel
        - redFlags
        - overallExplanation
        - suggestedResponses
        - needsMoreContext
        - contextQuestions
    AnalysisHistoryItem:
      type: object
      properties:
        id:
          type: string
        inputMode:
          type: string
          enum: [image, text]
        createdAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/AnalysisResult"
      required:
        - id
        - inputMode
        - createdAt
        - result
    AnalysisHistoryResponse:
      type: object
      properties:
        analyses:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisHistoryItem"
      required:
        - analyses
    LimitReachedResponse:
      type: object
      properties:
        error:
          type: string
        limitReached:
          type: boolean
      required:
        - error
        - limitReached
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
